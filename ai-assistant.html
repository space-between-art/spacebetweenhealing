<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光光 AI 品牌診斷 | Space Between Healing</title>
    
    <!-- SEO Meta -->
    <meta name="description" content="免費 AI 品牌診斷，24 小時服務 | 同光光傾幾句，搵出你品牌嘅問題">
    <link rel="canonical" href="https://spacebetweenhealing.com/ai-assistant.html">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Outfit:wght@300;400;500;600&family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #0a0a0a;
            --bg-dark: #111;
            --bg-card: #161616;
            --gold: #d4a574;
            --gold-light: #e8c9a0;
            --sage: #a0b89c;
            --cream: #f5efe6;
            --glow-gold: rgba(212,165,116,0.35);
            --glow-sage: rgba(160,184,156,0.25);
            --text-primary: #f5efe6;
            --text-secondary: rgba(245,239,230,0.7);
            --text-muted: rgba(245,239,230,0.45);
            --font-display: 'Cormorant Garamond', serif;
            --font-body: 'Outfit', sans-serif;
            --font-zh: 'Noto Serif TC', serif;
            --font-zh-sans: 'Noto Sans TC', sans-serif;
            --ease: cubic-bezier(0.16,1,0.3,1);
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; }
        body { font-family:var(--font-body); background:var(--bg-deep); color:var(--text-primary); line-height:1.6; overflow:hidden; display:flex; flex-direction:column; }
        .zh { font-family:var(--font-zh-sans); }

        /* Ambient */
        .ambient { position:fixed; inset:0; z-index:-1; pointer-events:none; }
        .orb { position:absolute; border-radius:50%; filter:blur(120px); opacity:0.3; }
        .orb-1 { width:400px; height:400px; background:radial-gradient(circle,var(--glow-gold) 0%,transparent 70%); top:-10%; left:-5%; animation:float 30s ease-in-out infinite; }
        .orb-2 { width:300px; height:300px; background:radial-gradient(circle,var(--glow-sage) 0%,transparent 70%); bottom:-5%; right:-3%; animation:float 35s ease-in-out infinite reverse; }
        @keyframes float { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,-15px)} }

        /* Header */
        .chat-header { background:rgba(10,10,10,0.95); backdrop-filter:blur(20px); border-bottom:1px solid rgba(212,165,116,0.1); padding:1rem 1.5rem; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
        .chat-header-left { display:flex; align-items:center; gap:1rem; }
        .back-link { display:flex; align-items:center; gap:0.4rem; color:var(--text-secondary); text-decoration:none; font-size:0.85rem; transition:color 0.3s; }
        .back-link:hover { color:var(--gold); }
        .back-link svg { width:18px; height:18px; }
        .chat-title { font-family:var(--font-display); font-size:1.1rem; color:var(--gold); letter-spacing:0.1em; }
        .chat-status { display:flex; align-items:center; gap:0.4rem; font-size:0.75rem; color:var(--sage); }
        .status-dot { width:6px; height:6px; border-radius:50%; background:var(--sage); animation:pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* Chat Container */
        .chat-container { flex:1; display:flex; flex-direction:column; max-width:800px; width:100%; margin:0 auto; padding:0 1rem; overflow:hidden; }
        
        /* Messages Area */
        .messages { flex:1; overflow-y:auto; padding:1.5rem 0; display:flex; flex-direction:column; gap:1rem; }
        .messages::-webkit-scrollbar { width:4px; }
        .messages::-webkit-scrollbar-track { background:transparent; }
        .messages::-webkit-scrollbar-thumb { background:rgba(212,165,116,0.2); border-radius:2px; }

        /* Message Bubbles */
        .message { display:flex; gap:0.75rem; max-width:85%; animation:fadeIn 0.3s var(--ease); }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .message.user { align-self:flex-end; flex-direction:row-reverse; }
        .message-avatar { width:36px; height:36px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.85rem; }
        .message.bot .message-avatar { background:linear-gradient(135deg, var(--gold), var(--sage)); color:var(--bg-deep); }
        .message.user .message-avatar { background:rgba(212,165,116,0.15); color:var(--gold); }
        .message-content { background:var(--bg-card); border:1px solid rgba(212,165,116,0.1); border-radius:16px; padding:1rem 1.25rem; }
        .message.user .message-content { background:rgba(212,165,116,0.1); border-color:rgba(212,165,116,0.2); }
        .message-content p { color:var(--text-primary); line-height:1.7; }
        .message-content p + p { margin-top:0.75rem; }

        /* Typing Indicator */
        .typing { display:flex; gap:4px; padding:0.5rem 0; }
        .typing span { width:6px; height:6px; border-radius:50%; background:var(--gold); opacity:0.4; animation:typing 1.4s ease-in-out infinite; }
        .typing span:nth-child(2) { animation-delay:0.2s; }
        .typing span:nth-child(3) { animation-delay:0.4s; }
        @keyframes typing { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-6px);opacity:1} }

        /* Quick Replies */
        .quick-replies { display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:1rem; }
        .quick-reply { background:rgba(212,165,116,0.08); border:1px solid rgba(212,165,116,0.2); border-radius:100px; padding:0.5rem 1rem; font-size:0.85rem; color:var(--gold); cursor:pointer; transition:all 0.3s var(--ease); }
        .quick-reply:hover { background:rgba(212,165,116,0.15); border-color:var(--gold); }

        /* Input Area */
        .input-area { padding:1rem 0 1.5rem; flex-shrink:0; }
        .input-wrapper { display:flex; gap:0.75rem; background:var(--bg-card); border:1px solid rgba(212,165,116,0.15); border-radius:16px; padding:0.5rem; transition:border-color 0.3s; }
        .input-wrapper:focus-within { border-color:var(--gold); }
        .chat-input { flex:1; background:transparent; border:none; color:var(--text-primary); font-family:var(--font-zh-sans); font-size:0.95rem; padding:0.75rem; resize:none; max-height:120px; line-height:1.5; }
        .chat-input::placeholder { color:var(--text-muted); }
        .chat-input:focus { outline:none; }
        .send-btn { width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg, var(--gold), var(--gold-light)); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.3s var(--ease); flex-shrink:0; }
        .send-btn:hover { transform:scale(1.05); }
        .send-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
        .send-btn svg { width:20px; height:20px; color:var(--bg-deep); }

        /* Disclaimer */
        .disclaimer { text-align:center; padding:0.75rem; font-size:0.7rem; color:var(--text-muted); }
        .disclaimer a { color:var(--sage); text-decoration:none; }
        .disclaimer a:hover { text-decoration:underline; }

        /* Welcome Screen */
        .welcome { text-align:center; padding:2rem 1rem; }
        .welcome-avatar { width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg, var(--gold), var(--sage)); margin:0 auto 1.5rem; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 40px rgba(212,165,116,0.3); }
        .welcome-avatar svg { width:40px; height:40px; color:var(--bg-deep); }
        .welcome h2 { font-family:var(--font-display); font-size:1.75rem; color:var(--cream); margin-bottom:0.5rem; }
        .welcome p { color:var(--text-secondary); max-width:400px; margin:0 auto 2rem; line-height:1.7; }
        .welcome-features { display:flex; flex-direction:column; gap:0.75rem; max-width:350px; margin:0 auto; }
        .feature-item { display:flex; align-items:center; gap:0.75rem; text-align:left; color:var(--text-secondary); font-size:0.9rem; }
        .feature-item svg { width:18px; height:18px; color:var(--gold); flex-shrink:0; }
    </style>
</head>
<body>
    <div class="ambient"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

    <!-- Header -->
    <header class="chat-header">
        <div class="chat-header-left">
            <a href="index.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span>返回</span>
            </a>
        </div>
        <div style="text-align:center;">
            <div class="chat-title">光光</div>
            <div class="chat-status">
                <span class="status-dot"></span>
                <span>AI 品牌助理</span>
            </div>
        </div>
        <div style="width:60px;"></div>
    </header>

    <!-- Chat Container -->
    <div class="chat-container">
        <div class="messages" id="messages">
            <!-- Welcome Screen -->
            <div class="welcome" id="welcome">
                <div class="welcome-avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2a4 4 0 0 1 4 4v1a2 2 0 0 1 2 2v1a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a2 2 0 0 1 2-2V6a4 4 0 0 1 4-4z"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="9" r="1"/><path d="M9 13h6"/><path d="M12 14v8"/><path d="M8 22h8"/></svg>
                </div>
                <h2 class="zh">你好！我係光光 ☀️</h2>
                <p class="zh">我係 Space Between Healing 嘅 AI 品牌助理。<br>唔肯定你嘅品牌有咩問題？同我傾幾句，我幫你搵出「症狀」，俾你一啲方向。</p>
                <div class="welcome-features">
                    <div class="feature-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
                        <span class="zh">免費使用，唔收錢</span>
                    </div>
                    <div class="feature-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                        <span class="zh">24 小時都喺度</span>
                    </div>
                    <div class="feature-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        <span class="zh">對話內容會保密</span>
                    </div>
                </div>
                <div class="quick-replies" style="justify-content:center;margin-top:2rem;">
                    <button class="quick-reply" onclick="sendQuickReply('我想做品牌，但唔知從何入手')">🤔 唔知從何入手</button>
                    <button class="quick-reply" onclick="sendQuickReply('我唔知點介紹自己嘅服務')">💬 唔知點介紹自己</button>
                    <button class="quick-reply" onclick="sendQuickReply('我想知道我嘅品牌有咩問題')">🔍 想診斷我嘅品牌</button>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea class="chat-input zh" id="chatInput" placeholder="有咩想問？打嚟呢度⋯" rows="1" onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4L22 2z"/></svg>
                </button>
            </div>
            <div class="disclaimer">
                <span class="zh">光光係 AI，唔係真人顧問。如需專業意見，請</span>
                <a href="contact.html" class="zh">聯絡我哋</a>
            </div>
        </div>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcomeEl = document.getElementById('welcome');
        
        let conversationHistory = [];
        let isWaiting = false;

        // Auto-resize textarea
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function sendQuickReply(text) {
            chatInput.value = text;
            sendMessage();
        }

        function addMessage(content, isUser = false) {
            // Hide welcome screen on first message
            if (welcomeEl) {
                welcomeEl.style.display = 'none';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = isUser ? '你' : '☀️';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            // Handle markdown-style formatting
            const formattedContent = content
                .split('\n\n')
                .map(p => `<p class="zh">${p}</p>`)
                .join('');
            contentDiv.innerHTML = formattedContent;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            messagesEl.appendChild(messageDiv);
            
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return messageDiv;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typing';
            typingDiv.innerHTML = `
                <div class="message-avatar">☀️</div>
                <div class="message-content">
                    <div class="typing"><span></span><span></span><span></span></div>
                </div>
            `;
            messagesEl.appendChild(typingDiv);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message || isWaiting) return;

            // Add user message
            addMessage(message, true);
            chatInput.value = '';
            chatInput.style.height = 'auto';
            
            // Update conversation history
            conversationHistory.push({ role: 'user', content: message });
            
            // Show typing indicator
            isWaiting = true;
            sendBtn.disabled = true;
            showTyping();

            try {
                // Call your n8n webhook or AI endpoint
                const response = await fetch('https://spacebetween.app.n8n.cloud/webhook/guangguang-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        history: conversationHistory.slice(-10) // Last 10 messages for context
                    })
                });

                hideTyping();
                
                if (response.ok) {
                    const data = await response.json();
                    const botReply = data.reply || data.response || data.message || '唔好意思，我暫時聽唔明，可以試下用另一個方式講？';
                    addMessage(botReply);
                    conversationHistory.push({ role: 'assistant', content: botReply });
                } else {
                    throw new Error('API error');
                }
            } catch (error) {
                hideTyping();
                addMessage('唔好意思，我依家有啲問題，麻煩你遲啲再試。如果有急事，可以直接 WhatsApp 我哋嘅真人顧問！');
                console.error('Chat error:', error);
            }

            isWaiting = false;
            sendBtn.disabled = false;
        }

        // Focus input on load
        chatInput.focus();
    </script>
</body>
</html>
